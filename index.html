<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#121212">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Distribuidora Don Luis">
<title>Distribuidora Don Luis</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--tx:#111827;--mut:#6b7280;--pri:#1a8870;--acc:#e5c74f;--hd:#121212;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--bd:#d1d5db}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--card:#1c1c1c;--tx:#f3f4f6;--mut:#a3a3a3;--pri:#2ab397;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--bd:#333}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,sans-serif;padding-bottom:90px}
header{position:sticky;top:0;z-index:5;background:var(--hd);border-bottom:3px solid var(--acc);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px;min-height:52px}
header h1{font-size:18px;margin:0;flex:1;min-width:0;line-height:1.1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
header button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:14px;font-weight:600}
main{padding:12px;max-width:640px;margin:0 auto}
input,textarea{width:100%;padding:10px 12px;min-height:46px;font:inherit;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.btn{padding:12px 14px;min-height:46px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-weight:700;font-size:16px;width:100%}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn.bad{background:var(--bad)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.menu button{min-height:110px;border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);font-size:16px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.menu button span{font-size:32px}
.menu button.main{grid-column:1/3;background:var(--pri);color:#fff;border:0}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mut{color:var(--mut);font-size:13px}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid var(--bd)}
.tag.promo{background:#fef3c7;color:#92400e;border-color:#fcd34d}
.tag.bad{color:var(--bad)}.tag.warn{color:var(--warn)}.tag.ok{color:var(--ok)}
.off{opacity:.5}
.qty{display:flex;align-items:center;gap:6px;flex:none}
.qty button{width:42px;height:42px;border:0;border-radius:10px;background:var(--pri);color:#fff;font-size:22px;font-weight:700}
.qty button:disabled{background:var(--bd)}
.qty b{min-width:34px;text-align:center;font-size:18px;cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 12px;display:flex;gap:10px;align-items:center;z-index:6}
.bar.sel{bottom:calc(57px + env(safe-area-inset-bottom));box-shadow:0 -4px 12px rgba(0,0,0,.15)}
.bar .tot{flex:1;font-size:20px;font-weight:800}
.bar .btn{width:auto;flex:none;padding:12px 22px}
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{opacity:0;width:100%;height:100%;position:absolute;inset:0;margin:0;z-index:1}
.sw i{position:absolute;inset:0;background:var(--bd);border-radius:99px;transition:.15s}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i:after{left:23px}
.hoja{background:#fff;color:#111827;border:1px solid #d1d5db;border-radius:12px;padding:16px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.hoja-meta{font-size:12px;color:#6b7280;margin-bottom:8px}
.hoja-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:12px;border-bottom:2px solid #111827}
.hoja-cod{font-size:26px;font-weight:800;line-height:1.1}
.hoja-cli{text-align:right;min-width:0}.hoja-cli b{display:block;font-size:17px;overflow-wrap:anywhere}.hoja-cli span{display:block;font-size:14px;color:#374151;overflow-wrap:anywhere}
.hoja table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
.hoja th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#6b7280;border-bottom:1px solid #d1d5db;padding:4px 4px}
.hoja td{padding:7px 4px;border-bottom:1px solid #e5e7eb;vertical-align:top}
.hoja .n{text-align:right;white-space:nowrap}.hoja td.c{font-weight:700;white-space:nowrap}
.hoja-nota{margin-top:10px;padding:8px;background:#fef3c7;border-radius:8px;font-size:14px}
.hoja-total{margin-top:14px;text-align:right;font-size:15px}.hoja-total b{font-size:24px;margin-left:6px}
.chips{display:flex;gap:8px;margin:8px 0;overflow-x:auto}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.chips.dos{display:grid;grid-template-columns:1fr 1fr;overflow:visible}
.chips.dos button{width:100%;border-radius:12px;padding:10px 8px}
.chips button{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:14px}
.chips button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.price{font-weight:700;white-space:nowrap}
.price s{color:var(--mut);font-weight:400;font-size:12px;margin-right:4px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;max-width:90%;display:none;font-size:14px}
.quien{margin-left:auto;flex:none;max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:700;background:rgba(255,255,255,.2);border-radius:99px;padding:5px 11px}
.quien small{font-weight:500;opacity:.85}
@media (max-width:600px){.quien small{display:none}.quien{max-width:55%}}
.estado{padding:8px 12px;font-size:14px;font-weight:600;text-align:center;background:#fef3c7;color:#78350f}
.estado.ok{background:#dcfce7;color:#166534}
.detalle{margin-top:10px}
.detalle .row{padding:6px 0}
.drow{padding:9px 0;border-bottom:1px solid var(--bd)}
.drow:last-of-type{border-bottom:0}
.dtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dn{min-width:0;flex:1}
.dn b{display:block;font-size:15px;line-height:1.2;overflow-wrap:anywhere}
.dn .mut{font-size:12px}
.dp{text-align:right;font-size:11px;line-height:1.25;color:var(--mut);white-space:nowrap;flex:none}
.dp b{display:block;font-size:13px;color:var(--tx)}
.dsub{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:3px}
.dcode{min-width:0;flex:1;font-size:17px;font-weight:700;color:var(--tx);color:var(--mut);overflow-wrap:anywhere}
.dctl{display:flex;align-items:center;justify-content:flex-end;gap:5px;flex:none}
.drow .qty{gap:4px}
.drow .qty button{width:30px;height:30px;border-radius:8px;font-size:17px;padding:0}
.drow .qin{width:52px;min-height:30px;height:30px;font-size:15px;padding:2px;border-radius:8px}
.drow .xq{width:24px;min-height:24px;height:24px;padding:0;color:var(--bad);flex:none;border-radius:6px;font-size:11px;line-height:1}
.dtot{border-top:1px solid var(--bd)!important}
.qin{width:68px;text-align:center;font-size:18px;font-weight:700;padding:6px;min-height:42px}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);z-index:7;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:none;color:var(--mut);padding:8px 2px 7px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px}
.tabs button span{font-size:22px;line-height:1}
.tabs button.on{color:var(--pri);border-top:3px solid var(--pri);padding-top:5px}
.card h2{font-size:17px;margin:0 0 4px}
.promo-offer{flex-basis:100%;background:#fef3c7;color:#78350f;border:1px solid #fcd34d;border-radius:10px;padding:10px}
.promo-offer .row{gap:8px}.promo-offer .btn{width:auto;flex:1;min-height:42px;padding:8px}
.promo-ok{flex-basis:100%;background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok);border-radius:10px;padding:8px 10px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px}
.promo-ok .btn,.promo-hint .btn{width:auto;min-height:32px;padding:2px 10px;font-size:13px}
.promo-hint{flex-basis:100%;font-size:13px;color:var(--warn)}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
.modal-card{background:var(--card);color:var(--tx);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px 24px;box-shadow:0 -8px 30px rgba(0,0,0,.35)}
@media (min-width:600px){.modal{align-items:center}.modal-card{border-radius:20px}}
.login{max-width:360px;margin:6vh auto 0;padding:0 16px}
body.login-pg{background:radial-gradient(460px 380px at 0% 100%,rgba(42,179,151,.30),transparent 70%),radial-gradient(420px 340px at 100% 60%,rgba(229,199,79,.17),transparent 70%),#121212;background-attachment:fixed;min-height:100vh;--tx:#f3f4f6;--mut:#a3a3a3;--card:#1c1c1c;--bd:#333;--pri:#2ab397}
.login img.logo{display:block;margin:0 auto 6px;width:230px;height:230px;border-radius:12px}
header .campana{position:relative;flex:none;width:40px;height:38px;padding:0;font-size:19px;background:rgba(255,255,255,.14)}
header .campana b{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;text-align:center;padding:0 4px}
header img.marca{height:34px;width:auto;flex:none}
body.login-pg .btn:not(.sec){color:#04231c}
.login h1{text-align:center;color:var(--pri)}
.login-card{background:#1c1c1c;border:1px solid #2e2e2e;border-top:3px solid var(--acc);border-radius:20px;padding:22px 20px;box-shadow:0 16px 40px rgba(0,0,0,.4)}
.login-card h2{margin:0 0 2px;font-size:24px;color:#fff}
.login-card .sub{margin:0 0 8px;color:var(--mut)}
.login-card input{background:#121212}
@media (min-width:900px){
  body.login-pg{background:radial-gradient(900px 600px at 0% 100%,rgba(42,179,151,.26),transparent 70%),radial-gradient(800px 560px at 100% 0%,rgba(229,199,79,.15),transparent 65%),#121212;background-attachment:fixed;min-height:100vh;padding-bottom:0}
  .login{display:grid;grid-template-columns:1fr 410px;gap:72px;align-items:center;max-width:1080px;min-height:100vh;margin:0 auto;padding:40px 32px}
  .login img.logo{width:min(100%,540px);height:auto;margin:0 auto;-webkit-mask-image:radial-gradient(closest-side,#000 78%,transparent 100%);mask-image:radial-gradient(closest-side,#000 78%,transparent 100%)}
  .login-card{background:#1c1c1c;border:1px solid #2e2e2e;border-top:3px solid var(--acc);border-radius:20px;padding:38px 34px;box-shadow:0 24px 70px rgba(0,0,0,.5)}
  .login-card h2{display:block;margin:0 0 4px;font-size:28px;color:#fff}
  .login-card .sub{display:block;margin:0 0 14px;color:var(--mut)}
  .login-card input{background:#121212;min-height:50px;font-size:17px}
  .login-card .btn{margin-top:6px;min-height:52px;font-size:17px}
}

/* ---- computadora: menú lateral, pedido en dos columnas, listas en dos columnas ---- */
@media (min-width:900px){
  body{padding-bottom:24px}
  main{max-width:1200px;padding:20px 28px}
  body.hay-tabs main{width:calc(100% - 210px);max-width:none;margin:0 0 0 210px;box-sizing:border-box;padding:20px max(28px, calc((100vw - 210px - 1200px) / 2))}
  body.hay-tabs .estado{margin-left:210px}
  .bar.sel{bottom:0;left:210px}
  .tabs{top:52px;bottom:0;left:0;right:auto;width:210px;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--bd);padding:10px 0}
  .tabs button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;padding:12px 20px;min-height:0;border-left:4px solid transparent;cursor:pointer}
  .tabs button span{font-size:20px;flex:none}
  .tabs button{text-align:left}
  .tabs button.on{border-top:0;border-left:4px solid var(--pri);padding-top:12px;background:color-mix(in srgb,var(--pri) 10%,transparent)}
  .tabs .abajo{margin-top:auto;border-top:1px solid var(--bd);padding-top:6px;display:flex;flex-direction:column}
  .tabs .abajo button{width:100%;background:none}
  .tabs button:hover{background:color-mix(in srgb,var(--pri) 8%,transparent)}
  .menu{grid-template-columns:repeat(3,1fr)}
  .menu button{min-height:130px;cursor:pointer}
  .menu button.main{grid-column:1/-1;min-height:110px}
  .ped-grid{display:grid;grid-template-columns:minmax(360px,5fr) minmax(420px,6fr);gap:28px;align-items:start}
  .ped-izq,.ped-der{min-width:0}
  .bar{position:sticky;bottom:0;left:auto;right:auto;border:1px solid var(--bd);border-radius:12px;margin-top:12px;box-shadow:0 -4px 14px rgba(0,0,0,.1)}
  .cols2{column-count:2;column-gap:32px}
  .cols2 .row{break-inside:avoid}
  .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 14px;align-items:start}
  .grid2>p{grid-column:1/-1;margin:0}
  .grid2>.card{margin:0}
  [data-sel],[data-ped],[data-edit],[data-editcli],[data-edituser],[data-cli],[data-precio],[data-promoprecio],[data-editcombo],[data-go]{cursor:pointer}
  .row[data-sel]:hover,.row[data-edit]:hover,.row[data-editcli]:hover,.row[data-edituser]:hover,.row[data-cli]:hover,.row[data-precio]:hover,.row[data-promoprecio]:hover,.row[data-editcombo]:hover,.card[data-ped]:hover{background:color-mix(in srgb,var(--pri) 8%,transparent)}
  .btn:hover{filter:brightness(1.07)}
  .modal-card{max-width:640px}
  #toast{bottom:30px}
}
</style>
</head>
<body>
<div id="app"><p style="padding:24px;text-align:center">Cargando…</p></div>
<noscript>Esta app necesita JavaScript.</noscript>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" integrity="sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw" crossorigin="anonymous" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk" crossorigin="anonymous" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" integrity="sha384-fCAW/rDWORTbQXSiB7mOg0QtQ5c+r0f544y6XoKjuVva0nMBlCpNUjiFeG5iMdS3" crossorigin="anonymous" defer></script>
<script>
window.addEventListener('error', e => { const a = document.getElementById('app'); if (a && /Cargando/.test(a.textContent)) a.innerHTML = '<p style="padding:24px;color:#b91c1c">Error al iniciar: ' + String(e.message).replace(/</g, '&lt;') + '</p>'; });
let instalar = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); instalar = e; if (view === 'config') render(); });
window.addEventListener('appinstalled', () => { instalar = null; if (view === 'config') render(); });
const yaInstalada = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => Number(n || 0).toLocaleString('es-AR', { style: 'currency', currency: 'ARS' });
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
// Promos: precio fijo (precioPromo) o descuento % (promoPct). Con cantidad mínima > 1 se le ofrece al vendedor cuando llega a esa cantidad.
const hayPromo = p => !!p.promo && (p.precioPromo > 0 || p.promoPct > 0);
const promoCantDe = p => Math.max(1, p.promoCant || 1);
const promoPorCant = p => hayPromo(p) && promoCantDe(p) > 1;
const precioPromoDe = p => Math.round((p.precioPromo > 0 ? p.precioPromo : p.precio * (100 - (p.promoPct || 0)) / 100) * 100) / 100;
const efectivo = p => (hayPromo(p) && promoCantDe(p) <= 1 ? precioPromoDe(p) : p.precio);   // precio de la promo automática
const promoQue = p => p.precioPromo > 0 ? money(precioPromoDe(p)) + ' c/u' : (p.promoPct || 0) + '% de descuento';
const promoTxt = p => promoPorCant(p) ? `${promoCantDe(p)}+ · ${promoQue(p)}` : promoQue(p);
const promoDesc = p => promoPorCant(p) ? `${promoQue(p)} llevando ${promoCantDe(p)} o más` : promoQue(p);

// En la PC la sesión dura mientras la ventana de la app esté abierta (al cerrarla se cierra la sesión; recargar la mantiene); en el celular dura 30 días
const esPC = window.matchMedia('(min-width:900px)').matches;
const guardaSesion = esPC ? sessionStorage : localStorage;
let token = null, user = null;
try { token = guardaSesion.getItem('pd_token'); user = JSON.parse(guardaSesion.getItem('pd_user')); } catch {}
if (esPC) { try { localStorage.removeItem('pd_token'); localStorage.removeItem('pd_user'); } catch {} }
if (esPC) window.addEventListener('beforeunload', e => { if (token) { e.preventDefault(); e.returnValue = ''; } });   // al cerrar la ventana el navegador pregunta si querés salir
if (!user || !user.rol) token = null;
let productos = [], pedidos = [], usuarios = [], clientes = [], combos = [], novedades = [], dbOk = true;
const esAdmin = () => user && user.rol === 'admin';
let view = 'menu', draft = null, q = '', filtro = 'todos';

function toast(t) { const el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 2800); }

async function api(method, url, data) {
  let r;
  try { r = await fetch('/api/' + url, { method, headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token }, body: data ? JSON.stringify(data) : undefined }); }
  catch { throw Object.assign(new Error('Sin señal'), { offline: true }); }
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && url !== 'p/login') { salir(); throw new Error('Sesión vencida'); }
  if (!r.ok) throw new Error(j.error || 'Error');
  return j;
}
/* ---------- sin señal: datos en el teléfono y cola de pedidos pendientes ---------- */
const lsGet = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };
const cacheDatos = () => lsSet('pd_cache', { productos, clientes, combos, novedades, pedidos: pedidos.slice(0, 200) });
const leerCola = () => lsGet('pd_cola', []);
const colaMia = () => leerCola().filter(x => x.u === user.id);
function usarCache() { const c = lsGet('pd_cache', null); if (c) { productos = c.productos; pedidos = c.pedidos; clientes = c.clientes || []; combos = c.combos || []; novedades = c.novedades || []; } else toast('Sin señal y sin datos guardados todavía'); }
function estado() {
  const el = $('#estado'); if (!el) return;
  const n = colaMia().filter(x => !x.error).length, rech = colaMia().filter(x => x.error).length;
  const t = [!navigator.onLine ? 'Sin señal: los pedidos se guardan y se envían cuando vuelva' : '', n ? `${n} pedido(s) esperando para enviarse` : '', rech ? `${rech} pedido(s) rechazado(s), revisalos en Pedidos` : ''].filter(Boolean).join(' · ');
  el.hidden = !t; el.textContent = t;
}
let sincronizando = false;
async function sincronizar() {
  if (sincronizando || !token || !user) return;
  sincronizando = true;
  let enviados = 0, rechazados = 0;
  try {
    for (const it of colaMia().filter(x => !x.error)) {

/* ---------- notificaciones push ---------- */
const pushSoportado = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const b64aBytes = b => { const p = '='.repeat((4 - b.length % 4) % 4), r = atob((b + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...r].map(c => c.charCodeAt(0))); };
async function pushEstado() {   // { ok: puede usarse, permiso, activa }
  if (!pushSoportado()) return { ok: false };
  try { const reg = await Promise.race([navigator.serviceWorker.ready, new Promise((_, no) => setTimeout(() => no(new Error('sin service worker')), 3000))]), sub = await reg.pushManager.getSubscription(); return { ok: true, permiso: Notification.permission, activa: !!sub && Notification.permission === 'granted' }; } catch { return { ok: false }; }
}
async function activarPush() {
  try {
    if (await Notification.requestPermission() !== 'granted') return toast('Las notificaciones están bloqueadas: habilitalas en el navegador (candado de la barra de direcciones)');
    const { key } = await api('GET', 'p/pushkey'); if (!key) return toast('El servidor todavía no tiene las notificaciones habilitadas');
    const reg = await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64aBytes(key) });
    await api('POST', 'p/pushsub', { subscription: sub.toJSON() });
    toast('Notificaciones activadas en este dispositivo ✓');
  } catch (e) { toast('No se pudieron activar: ' + (e.message || e)); }
  pintarPush();
}
async function desactivarPush() {
  try { const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription(); if (sub) { await api('DELETE', 'p/pushsub', { endpoint: sub.endpoint }).catch(() => {}); await sub.unsubscribe(); } toast('Notificaciones desactivadas'); } catch (e) { toast(e.message); }
  pintarPush();
}
function olvidarPush(tok) {   // al cerrar sesión este dispositivo deja de recibir los avisos de ese usuario
  if (!pushSoportado()) return;
  navigator.serviceWorker.ready.then(reg => reg.pushManager.getSubscription()).then(sub => { if (!sub) return; fetch('/api/p/pushsub', { method: 'DELETE', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + tok }, body: JSON.stringify({ endpoint: sub.endpoint }) }).catch(() => {}); return sub.unsubscribe(); }).catch(() => {});
}
async function pintarPush() {
  const box = $('#pushBox'); if (!box) return;
  const e = await pushEstado();
  if (!e.ok) { box.innerHTML = '<p class="mut" style="margin:0">Este navegador no admite notificaciones. En iPhone hay que instalar la app (Safari → Compartir → Agregar a inicio) y abrirla desde el ícono.</p>'; return; }
  box.innerHTML = e.activa
    ? '<p style="margin:0 0 8px">🔔 Las notificaciones están <b>activadas</b> en este dispositivo.</p><button class="btn sec" data-act="pushOff">Desactivar</button>'
    : e.permiso === 'denied' ? '<p class="mut" style="margin:0">Las notificaciones están bloqueadas para este sitio. Habilitalas desde el candado de la barra de direcciones y volvé a intentar.</p>'
    : '<p class="mut" style="margin:0 0 8px">Recibí un aviso en el dispositivo cuando haya novedades, aunque la app esté cerrada.</p><button class="btn" data-act="pushOn">🔔 Activar notificaciones</button>';
}

let importFilas = null;
const COLS = { codigo: ['codigo', 'cod', 'sku', 'code'], nombre: ['nombre', 'descripcion', 'producto', 'articulo', 'detalle'], precio: ['precio', 'price', 'importe', 'pvp', 'lista'], activo: ['activo', 'habilitado'], multiplo: ['unidad de venta', 'unidad', 'multiplo', 'multiple', 'se vende de a'], stock: ['stock', 'existencia', 'existencias'] };
function leerHoja(rows) {
  rows = rows.filter(r => r.some(c => String(c ?? '').trim() !== ''));
  // el encabezado puede no estar en la primera fila (títulos arriba): se busca en las primeras filas la que tenga código y nombre/precio
  const mapear = r => { const cab = r.map(norm).map(x => x.trim()), m = {}; for (const [k, ks] of Object.entries(COLS)) { const i = cab.findIndex(c => c !== 'iva' && ks.some(w => c === w || c.startsWith(w))); if (i >= 0) m[k] = i; } return m; };
  let h = -1, mapa = {};
  for (let i = 0; i < Math.min(rows.length, 25); i++) { const m = mapear(rows[i]); if (m.codigo !== undefined && (m.nombre !== undefined || m.precio !== undefined)) { h = i; mapa = m; break; } }
  if (h < 0) { Object.assign(mapa, { codigo: 0, nombre: 1, precio: 2 }); }   // sin encabezados: A=código, B=nombre, C=precio
  return rows.slice(h + 1).map(r => Object.fromEntries(Object.entries(mapa).map(([k, i]) => [k, r[i] ?? ''])));
}
/* PDF de lista de precios: cada línea "código  artículo  IVA  precio". Precio 0 = sin precio: queda desactivado. */
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
async function cargarPdfjs() {
  if (window.pdfjsLib) return window.pdfjsLib;
  await new Promise((ok, ko) => { const el = document.createElement('script'); el.src = PDFJS + 'pdf.min.js'; el.integrity = 'sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e'; el.crossOrigin = 'anonymous'; el.onload = ok; el.onerror = ko; document.head.appendChild(el); });
  const w = await (await fetch(PDFJS + 'pdf.worker.min.js', { integrity: 'sha384-SnzOobpRMLXZ52iJvZm/C0fYw0OQemTXzTjIsdsfMcrCtCEe9qgzxTd3RSklO5x2' })).text();
  pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([w], { type: 'text/javascript' }));
  return pdfjsLib;
}
async function filasDePdf(file) {
  const lib = await cargarPdfjs();
  const pdf = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
  const rx = /^(\S+)\s+(.+?)\s+(\d{1,2}(?:[.,]\d+)?)\s+(\d+(?:[.,]\d+)?)$/, filas = [];
  for (let n = 1; n <= pdf.numPages; n++) {
    const items = (await (await pdf.getPage(n)).getTextContent()).items.filter(i => i.str.trim());
    const lineas = [];
    for (const i of items.sort((a, b) => b.transform[5] - a.transform[5])) {
      const l = lineas.find(x => Math.abs(x.y - i.transform[5]) < 2);
      l ? l.it.push(i) : lineas.push({ y: i.transform[5], it: [i] });
    }
    for (const l of lineas) {
      const m = rx.exec(l.it.sort((a, b) => a.transform[4] - b.transform[4]).map(i => i.str.trim()).join(' ').replace(/\s+/g, ' '));
      if (m) { const precio = parseFloat(m[4].replace(',', '.')); filas.push({ codigo: m[1], nombre: m[2], precio, activo: precio > 0 ? 'si' : 'no' }); }
    }
  }
  return filas;
}

      if (!importFilas.length) return toast('No se encontraron productos en el archivo');
      $('#prev').innerHTML = `<p><b>${importFilas.length}</b> filas leídas${importFilas.some(r => r.activo === 'no') ? ` (${importFilas.filter(r => r.activo === 'no').length} sin precio, quedan desactivadas)` : ''}. Ejemplo: ${esc(Object.values(importFilas[0] || {}).join(' | '))}</p>
        <p id="resumenImp"></p>
        <div class="row" style="border:0"><div class="nm"><b>Reemplazar toda la lista</b><span class="mut">Borra los productos que no figuren en el archivo y carga la lista nueva. Las promos y la unidad de venta quedan guardadas por código: se conservan en los que figuran y se recuperan solas si un producto borrado vuelve a aparecer.</span></div><label class="sw" style="margin:0"><input type="checkbox" id="cat" checked><i></i></label></div>
        <button class="btn" id="btnImp" data-act="importarConfirmar">Importar</button>`;
      resumenImportacion(); $('#cat').onchange = resumenImportacion;
    } catch { toast('No se pudo leer el archivo'); }
  };
}
const codImp = r => String(r.codigo ?? '').trim().toLowerCase();
function conteoImportacion() {
  const archivo = new Set(importFilas.map(codImp)), existentes = new Set(productos.map(p => p.codigo.toLowerCase()));
  return { nuevos: [...archivo].filter(c => c && !existentes.has(c)).length, actualizar: [...archivo].filter(c => existentes.has(c)).length, borrar: $('#cat').checked ? productos.filter(p => !archivo.has(p.codigo.toLowerCase())).length : 0 };
}
function resumenImportacion() {
  const c = conteoImportacion(), btn = $('#btnImp'); delete btn.dataset.seguro;
  $('#resumenImp').innerHTML = `Se crean <b>${c.nuevos}</b> productos nuevos y se actualizan <b>${c.actualizar}</b>.${c.borrar ? ` <b style="color:var(--bad)">Se borran ${c.borrar} productos</b> que hoy están cargados y no figuran en el archivo.` : ''}`;
  btn.textContent = c.borrar ? `Reemplazar la lista (borra ${c.borrar})` : 'Importar';
}
async function importarConfirmar(btn) {
  const c = conteoImportacion();
  if (c.borrar && btn && !btn.dataset.seguro) { btn.dataset.seguro = 1; btn.textContent = `Tocá de nuevo para borrar ${c.borrar} productos e importar`; return; }   // confirmación antes de borrar
  try {
    const r = await api('POST', 'p/importar', { rows: importFilas, reemplazar: $('#cat').checked });
    await cargar();
    $('#prev').innerHTML = `<p><b>Listo:</b> ${r.creados} creados, ${r.actualizados} actualizados${r.borrados ? `, <b>${r.borrados} borrados</b>` : ''}.</p>${r.errores.length ? `<p class="mut" style="color:var(--bad)">${r.errores.length} filas con error:<br>${r.errores.slice(0, 30).map(esc).join('<br>')}</p>` : ''}`;
  } catch (e) { toast(e.message); }
}
function exportarExcel() {
  if (!window.XLSX) return toast('No cargó el generador de Excel (revisá la conexión)');
  const ws = XLSX.utils.json_to_sheet(productos.map(p => ({ 'Código': p.codigo, 'Nombre': p.nombre, 'Precio': p.precio,'Unidad de venta': p.multiplo || 1, 'Stock': p.usaStock ? p.stock || 0 : '', 'Activo': p.activo ? 'si' : 'no' })));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Productos');
  XLSX.writeFile(wb, 'productos-' + new Date().toISOString().slice(0, 10) + '.xlsx');
}

/* ---------- eventos ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('button, [data-go], [data-sel], [data-editcombo], [data-ped], [data-pnav], [data-edit], [data-edituser], [data-editcli], [data-cli], [data-precio], [data-promoprecio], [data-nuevapromo]');
  if (!t || e.target.closest('[data-stop]')) return;
  const d = t.dataset, row = t.closest('[data-pid]');
  if (d.tab) {
    if (d.festado !== undefined) festado = d.festado;
    if (d.tab === view) { render(); return; }
    if (d.tab === 'menu') pila.length > 1 && pila[pila.length - 2] === 'menu' ? history.back() : go('menu', true);
    else go(d.tab, view !== 'menu');
  }
  else if (d.estado) {   // el administrador marca el pedido (cargado / pendiente / agregados revisados)
    try { await api('PUT', 'p/cargar/' + draft.id, { accion: d.estado }); await cargar(); nuevoDraft(pedidos.find(x => x.id === draft.id)); render(); toast('Pedido vuelto a pendiente'); } catch (er) { toast(er.message); }
  }
  else if (d.festado !== undefined && !d.tab) { festado = d.festado; render(); }
  else if (d.quitar) { delete draft.items[d.quitar]; const y = window.scrollY; pintarPedido(); window.scrollTo(0, y); }
  else if (d.combo) { const cid = t.closest('[data-cid]').dataset.cid; if (d.combo === 'ask') delete draft.combos[cid]; else draft.combos[cid] = d.combo; const y = window.scrollY; pintarPedido(); window.scrollTo(0, y); }
  else if (d.promo && row) { if (d.promo === 'ask') delete draft.promos[row.dataset.pid]; else draft.promos[row.dataset.pid] = d.promo; const y = window.scrollY; pintarPedido(); window.scrollTo(0, y); }
  else if (d.sel) { q = ''; $('#q').value = ''; cambiarCant(+d.sel, 1); if (escritorio()) $('#q').focus(); }   // tocar el producto lo agrega con cantidad 1; después se ajusta en el detalle
  else if (d.go) { if (d.nuevo) abrirNuevoPedido(); go(d.go); }
  else if (d.act === 'atras') {
    if (eligiendoPromo) { eligiendoPromo = false; return render(); }
    pila.length > 1 ? history.back() : go('menu', true);
  }
  else if (d.act === 'salir') salir();
  else if (d.act === 'instalarApp') { if (instalar) { instalar.prompt(); instalar.userChoice.then(() => { instalar = null; if (view === 'config') render(); }); } }
  else if (d.act === 'guardarPedido') guardarPedido();
  else if (d.modal) cerrarModal();
  else if (d.act === 'nuevoCombo') abrirCombo(null);
  else if (d.act === 'campana') { if (esAdmin()) { festado = 'agregados'; if (view === 'pedidos') render(); else go('pedidos'); } else go('novedades'); }
  else if (d.act === 'pushOn') activarPush();
  else if (d.act === 'pushOff') desactivarPush();
  else if (d.act === 'nuevaNovedad') abrirNovedad(null);
  else if (d.ned) abrirNovedad(novedades.find(n => n.id == d.ned));
  else if (d.ndel) { if (confirm('¿Eliminar la novedad? Los vendedores dejan de verla.')) { try { await api('DELETE', 'p/novedades/' + d.ndel); novedades = novedades.filter(n => n.id != d.ndel); cacheDatos(); toast('Novedad eliminada'); render(); } catch (er) { toast(er.message); } } }
  else if (d.nleer) { try { await api('PUT', 'p/novedadleida/' + d.nleer); const n = novedades.find(x => x.id == d.nleer); if (n) n.leida = true; cacheDatos(); render(); } catch (er) { toast(er.message); } }
  else if (d.editcombo) abrirCombo(combos.find(c => c.id == d.editcombo));
  else if (d.gnuevo !== undefined) { comboEd.grupos.push({ cant: 6, pids: [] }); pintarCombo(); }
  else if (d.gdelg !== undefined) { comboEd.grupos.splice(+d.gdelg, 1); pintarCombo(); }
  else if (d.gadd) { const [i, pid] = d.gadd.split(':').map(Number); comboEd.grupos[i].pids.push(pid); pintarCombo(); }
  else if (d.gdel) { const [i, pid] = d.gdel.split(':').map(Number); comboEd.grupos[i].pids = comboEd.grupos[i].pids.filter(x => x !== pid); pintarCombo(); }
  else if (d.gdelp) { const [i, ...r] = d.gdelp.split(':'); comboEd.grupos[+i].perdidos = comboEd.grupos[+i].perdidos.filter(x => x !== r.join(':')); pintarCombo(); }
  else if (d.ctipo) { comboEd.tipo = d.ctipo; pintarCombo(); }
  else if (d.csave !== undefined) guardarCombo();
  else if (d.cdel !== undefined) {
    if (!t.dataset.seguro) { t.dataset.seguro = 1; t.textContent = 'Tocá de nuevo para confirmar'; return; }
    try { await api('DELETE', 'p/combos/' + comboEd.id); await cargar(); toast('Promo eliminada'); cerrarModal(); } catch (er) { toast(er.message); }
  }
  else if (d.act === 'nuevoProd') abrirProducto({ activo: true });
  else if (d.act === 'borrarProd') {
    if (!t.dataset.seguro) { t.dataset.seguro = 1; t.textContent = 'Tocá de nuevo para confirmar'; return; }   // doble toque en vez de cuadro del navegador
    try { await api('DELETE', 'p/productos/' + editando.id); await cargar(); toast('Producto eliminado'); cerrarModal(); } catch (er) { toast(er.message); }
  }
  else if (d.act === 'agregarPromo') { eligiendoPromo = true; vElegirPromo(); }
  else if (d.act === 'pdf') exportarPdf();
  else if (d.act === 'nuevoCliente') { clienteVolver = view === 'elegir' ? 'elegir' : 'clientes'; editC = {}; go('cliente'); }
  else if (d.turno) { draft.turno = d.turno; if (!draft.id) ss('pd_turno', d.turno); $('#turnos').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.turno === d.turno)); }
  else if (d.act === 'editarNota') { editNota = true; pintarNota(); }
  else if (d.act === 'cerrarNota') { editNota = false; pintarNota(); }
  else if (d.act === 'descartarBorrador') { descartarBorrador(); render(); }
  else if (d.act === 'descartarPedido') {
    if (!t.dataset.seguro) { t.dataset.seguro = 1; t.textContent = 'Tocá de nuevo para descartar'; return; }
    descartarBorrador(); nuevoDraft(); toast('Pedido descartado'); volverA('menu');
  }
  else if (d.act === 'cambiarCliente') go('elegir');
  else if (d.act === 'importarClientes') importarClientes();
  else if (d.act === 'plantillaClientes') plantillaClientes();
  else if (d.act === 'borrarCliente') {
    if (!confirm('¿Eliminar el cliente? Sus pedidos se conservan.')) return;
    try { await api('DELETE', 'p/clientes/' + editC.id); await cargar(); volverA('clientes'); } catch (er) { toast(er.message); }
  }
  else if (d.editcli) { clienteVolver = 'clientes'; editC = { ...clientes.find(c => c.id == d.editcli) }; go('cliente'); }
  else if (d.cli) { const c = clientes.find(x => x.id == d.cli); draft.clienteId = c.id; draft.cliente = nombreC(c); draft.clienteCodigo = c.codigo; history.back(); }
  else if (d.act === 'nuevoUsuario') { editU = { rol: 'vendedor', activo: true }; go('usuario'); }
  else if (d.act === 'borrarUsuario') {
    if (!confirm('¿Eliminar el usuario? Sus pedidos se conservan.')) return;
    try { await api('DELETE', 'p/usuarios/' + editU.id); await cargar(); volverA('usuarios'); } catch (er) { toast(er.message); }
  }
  else if (d.edituser) { editU = { ...usuarios.find(u => u.id == d.edituser) }; go('usuario'); }
  else if (d.reint) { lsSet('pd_cola', leerCola().map(x => x.uid === d.reint ? { uid: x.uid, u: x.u, body: x.body, total: x.total, t: x.t } : x)); render(); sincronizar(); }
  else if (d.delcola) {
    if (!confirm('¿Eliminar este pedido pendiente? No se va a enviar.')) return;
    const it = leerCola().find(x => x.uid === d.delcola);
    lsSet('pd_cola', leerCola().filter(x => x.uid !== d.delcola)); cacheDatos(); render();
  }
  else if (d.act === 'importarConfirmar') importarConfirmar(t);
  else if (d.act === 'exportarExcel') exportarExcel();
  else if (d.act === 'borrarPedido') borrarPedido();
  else if (d.act === 'verSinCargar') abrirHoja();
  else if (d.act === 'hojaCargar') hojaCargar();
  else if (d.hnav) hojaMover(+d.hnav);
  else if (d.pnav) irAPedido(+d.pnav);
  else if (d.act === 'selModo') { selMode = !selMode; selPeds = new Set(); if (repintarPeds) repintarPeds(); }
  else if (d.act === 'selTodos') { const cv = cargadosVisibles(), todos = cv.length && cv.every(p => selPeds.has(p.id)); selPeds = todos ? new Set() : new Set(cv.map(p => p.id)); if (repintarPeds) repintarPeds(); }
  else if (d.act === 'selEntregado') aplicarSel('entregado');
  else if (d.act === 'selEntrega') abrirEntrega();
  else if (d.act === 'guardarEntrega') guardarEntrega();
  else if (d.entsel) {
    entSel = d.entsel; document.querySelectorAll('[data-entsel]').forEach(x => { const on = x.dataset.entsel === entSel; x.style.borderColor = on ? 'var(--pri)' : ''; x.style.color = on ? 'var(--pri)' : ''; });
    const mb = $('#entMotivoBox'); if (mb) mb.hidden = !(entSel === 'devoluciones' || entSel === 'rechazado');
  }
  else if (d.ped && selMode && (pedidos.find(x => x.id === +d.ped) || {}).estado === 'cargado') { const id = +d.ped; selPeds.has(id) ? selPeds.delete(id) : selPeds.add(id); if (repintarPeds) repintarPeds(); }
  else if (d.ped) {
    navPeds = [...document.querySelectorAll('#lista [data-ped]')].map(x => +x.dataset.ped);
    try { const f = await api('GET', 'p/pedidos/' + d.ped); const i = pedidos.findIndex(x => x.id === f.id); if (i >= 0) pedidos[i] = f; } catch {}   // estado al día; sin señal se usa lo guardado
    nuevoDraft(pedidos.find(p => p.id == d.ped)); go('pedido');
  }
  else if (d.edit) abrirProducto(productos.find(p => p.id == d.edit));
  else if (d.f) { filtro = d.f; render(); }
  else if (d.q && row) cambiarCant(+row.dataset.pid, +d.q, d.q === 'set' ? +(prompt('Cantidad', draft.items[row.dataset.pid] || 0) ?? NaN) : undefined);
  else if (d.quitarpromo) { await setProd(+d.quitarpromo, { promo: false }); render(); }
  else if (d.promoprecio) abrirProducto(productos.find(x => x.id == d.promoprecio));
  else if (d.nuevapromo) abrirProducto({ ...productos.find(x => x.id == d.nuevapromo), promo: true });
  else if (d.precio) abrirProducto(productos.find(x => x.id == d.precio));
});
// cantidad escrita con el teclado en el detalle
document.addEventListener('input', e => {
  const pid = e.target.dataset && e.target.dataset.qin; if (!pid) return;
  const c = parseInt(e.target.value);
  if (c > 0) draft.items[pid] = Math.min(c, 99999); else if (e.target.value !== '') delete draft.items[pid];
  const p = productos.find(x => x.id == pid), sub = e.target.closest('[data-pid]').querySelector('[data-sub]');
  if (sub && c > 0) sub.textContent = money(totalLinea(p));
  pintarLista(); pintarTotal();
});
document.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.qex) {   // unidades de más (fuera del pack): el total es lo del pack más lo escrito
    const pid = +e.target.dataset.qex, p = productos.find(x => x.id === pid); if (!p) return;
    const t = Math.max(0, parseInt(e.target.value) || 0), y = window.scrollY;
    cambiarCant(pid, 0, unidadesPromo(p) + t); window.scrollTo(0, y); return;
  }
  if (e.target.dataset && e.target.dataset.qin) {
    const pid = +e.target.dataset.qin, p = productos.find(x => x.id === pid), m = p ? multiploDe(p) : 1;
    if (draft.items[pid] % m) draft.items[pid] = Math.ceil(draft.items[pid] / m) * m;
    if (p && p.usaStock && draft.items[pid] > stockDisp(p)) { const t = Math.floor(stockDisp(p) / m) * m; toast(`Stock disponible de ${p.nombre}: ${stockDisp(p)}`); if (t > 0) draft.items[pid] = t; else delete draft.items[pid]; }   // no se pide más de lo que hay
    const y = window.scrollY; pintarPedido(); window.scrollTo(0, y);
  }
});
document.addEventListener('focusin', e => { if (e.target.dataset && (e.target.dataset.qin || e.target.dataset.qex)) e.target.select(); });
document.addEventListener('change', async e => {
  const id = e.target.dataset.activo;
  if (id) { await setProd(+id, { activo: e.target.checked }); render(); }
});
try { window.matchMedia('(min-width:900px)').addEventListener('change', () => { if (token && !document.getElementById('modal')) render(); }); } catch {}
(async () => { if (token) { try { await cargar(); } catch (e) { if (e.offline) usarCache(); else token = null; } } try { history.replaceState({ d: -1 }, ''); if (!restaurarNav()) go('menu'); sincronizar(); } catch (e) { $('#app').innerHTML = '<p style="padding:24px;color:#b91c1c">Error: ' + esc(e.message) + '</p>'; } })();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
