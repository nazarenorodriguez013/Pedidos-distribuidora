<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pedidos">
<title>Pedidos Distribuidora</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--tx:#111827;--mut:#6b7280;--pri:#0f766e;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--bd:#d1d5db}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--pri:#14b8a6;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--bd:#334155}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,sans-serif;padding-bottom:90px}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px;min-height:52px}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:14px;font-weight:600}
main{padding:12px;max-width:640px;margin:0 auto}
input,textarea{width:100%;padding:10px 12px;min-height:46px;font:inherit;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.btn{padding:12px 14px;min-height:46px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-weight:700;font-size:16px;width:100%}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn.bad{background:var(--bad)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.menu button{min-height:110px;border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);font-size:16px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.menu button span{font-size:32px}
.menu button.main{grid-column:1/3;background:var(--pri);color:#fff;border:0}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mut{color:var(--mut);font-size:13px}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid var(--bd)}
.tag.promo{background:#fef3c7;color:#92400e;border-color:#fcd34d}
.tag.bad{color:var(--bad)}.tag.warn{color:var(--warn)}.tag.ok{color:var(--ok)}
.off{opacity:.5}
.qty{display:flex;align-items:center;gap:6px;flex:none}
.qty button{width:42px;height:42px;border:0;border-radius:10px;background:var(--pri);color:#fff;font-size:22px;font-weight:700}
.qty button:disabled{background:var(--bd)}
.qty b{min-width:34px;text-align:center;font-size:18px;cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 12px;display:flex;gap:10px;align-items:center;z-index:6}
.bar .tot{flex:1;font-size:20px;font-weight:800}
.bar .btn{width:auto;flex:none;padding:12px 22px}
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{opacity:0;width:100%;height:100%;position:absolute;inset:0;margin:0;z-index:1}
.sw i{position:absolute;inset:0;background:var(--bd);border-radius:99px;transition:.15s}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i:after{left:23px}
.chips{display:flex;gap:8px;margin:8px 0;overflow-x:auto}
.chips button{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:14px}
.chips button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.price{font-weight:700;white-space:nowrap}
.price s{color:var(--mut);font-weight:400;font-size:12px;margin-right:4px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;z-index:40;max-width:90%;display:none;font-size:14px}
.estado{padding:8px 12px;font-size:14px;font-weight:600;text-align:center;background:#fef3c7;color:#78350f}
.estado.ok{background:#dcfce7;color:#166534}
.detalle{margin-top:10px}
.detalle .row{padding:6px 0}
.detalle .qty button{width:34px;height:34px;font-size:18px}
.dtot{border-top:1px solid var(--bd)!important}
.qin{width:68px;text-align:center;font-size:18px;font-weight:700;padding:6px;min-height:42px}
.login{max-width:360px;margin:12vh auto 0;padding:0 16px}
.login h1{text-align:center;color:var(--pri)}
</style>
</head>
<body>
<div id="app"><p style="padding:24px;text-align:center">Cargando…</p></div>
<noscript>Esta app necesita JavaScript.</noscript>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" defer></script>
<script>
window.addEventListener('error', e => { const a = document.getElementById('app'); if (a && /Cargando/.test(a.textContent)) a.innerHTML = '<p style="padding:24px;color:#b91c1c">Error al iniciar: ' + String(e.message).replace(/</g, '&lt;') + '</p>'; });
let instalar = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); instalar = e; const b = document.getElementById('inst'); if (b) b.hidden = false; });
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => Number(n || 0).toLocaleString('es-AR', { style: 'currency', currency: 'ARS' });
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const efectivo = p => (p.promo && p.precioPromo > 0 ? p.precioPromo : p.precio);

let token = localStorage.getItem('pd_token'), user = null;
try { user = JSON.parse(localStorage.getItem('pd_user')); } catch {}
if (!user || !user.rol) token = null;
let productos = [], pedidos = [], usuarios = [], clientes = [], dbOk = true;
const esAdmin = () => user && user.rol === 'admin';
let view = 'menu', draft = null, q = '', filtro = 'todos';

function toast(t) { const el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 2800); }

async function api(method, url, data) {
  let r;
  try { r = await fetch('/api/' + url, { method, headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token }, body: data ? JSON.stringify(data) : undefined }); }
  catch { throw Object.assign(new Error('Sin señal'), { offline: true }); }
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && url !== 'p/login') { salir(); throw new Error('Sesión vencida'); }
  if (!r.ok) throw new Error(j.error || 'Error');
  return j;
}
/* ---------- sin señal: datos en el teléfono y cola de pedidos pendientes ---------- */
const lsGet = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };
const cacheDatos = () => lsSet('pd_cache', { productos, clientes, pedidos: pedidos.slice(0, 200) });
const leerCola = () => lsGet('pd_cola', []);
const colaMia = () => leerCola().filter(x => x.u === user.id);
function usarCache() { const c = lsGet('pd_cache', null); if (c) { productos = c.productos; pedidos = c.pedidos; clientes = c.clientes || []; } else toast('Sin señal y sin datos guardados todavía'); }
function estado() {
  const el = $('#estado'); if (!el) return;
  const n = colaMia().filter(x => !x.error).length, rech = colaMia().filter(x => x.error).length;
  const t = [!navigator.onLine ? 'Sin señal: los pedidos se guardan y se envían cuando vuelva' : '', n ? `${n} pedido(s) esperando para enviarse` : '', rech ? `${rech} pedido(s) rechazado(s), revisalos en Pedidos` : ''].filter(Boolean).join(' · ');
  el.hidden = !t; el.textContent = t;
}
let sincronizando = false;
async function sincronizar() {
  if (sincronizando || !token || !user) return;
  sincronizando = true;
  let enviados = 0, rechazados = 0;
  try {
    for (const it of colaMia().filter(x => !x.error)) {
      try { await api('POST', 'p/pedidos', { ...it.body, uid: it.uid }); lsSet('pd_cola', leerCola().filter(x => x.uid !== it.uid)); enviados++; }
      catch (e) {
        if (e.offline || /Sesión/.test(e.message)) break;
        lsSet('pd_cola', leerCola().map(x => x.uid === it.uid ? { ...x, error: e.message } : x)); rechazados++;
      }
    }
    if (enviados) { try { await cargar(); } catch {} toast(`${enviados} pedido(s) enviado(s)`); }
    if (rechazados) toast(`${rechazados} pedido(s) rechazado(s) por el servidor`);
    if (enviados || rechazados) { if (view === 'pedidos' || view === 'menu') render(); }
  } finally { sincronizando = false; estado(); }
}
window.addEventListener('online', () => { estado(); sincronizar(); });
window.addEventListener('offline', estado);
setInterval(sincronizar, 30000);

async function cargar() {
  const [a, b, c, y, cl] = await Promise.all([api('GET', 'p/productos'), api('GET', 'p/pedidos'), esAdmin() ? api('GET', 'p/usuarios') : { usuarios: [] }, api('GET', 'p/yo'), api('GET', 'p/clientes')]);
  clientes = cl.clientes;
  dbOk = y.db;
  productos = a.productos.sort((x, y) => x.nombre.localeCompare(y.nombre));
  pedidos = b.pedidos;
  usuarios = c.usuarios;
  cacheDatos();
}
function salir() { localStorage.removeItem('pd_token'); token = null; view = 'menu'; render(); }
function go(v) { view = v; q = ''; filtro = 'todos'; window.scrollTo(0, 0); render(); }

/* ---------- vistas ---------- */
const TITULOS = { menu: 'Distribuidora', pedido: 'Cargar pedido', pedidos: 'Pedidos', clientes: 'Clientes', importarc: 'Importar clientes', cliente: 'Cliente', elegir: 'Elegir cliente', productos: 'Productos', producto: 'Producto', usuarios: 'Usuarios', usuario: 'Usuario', importar: 'Importar Excel', clave: 'Mi contraseña', promos: 'Promociones de la semana', precios: 'Lista de precios' };
function render() {
  if (!token) return login();
  $('#app').innerHTML = `<header>${view !== 'menu' ? '<button data-act="atras">←</button>' : ''}<h1>${TITULOS[view]}</h1>${view === 'menu' ? `<button data-act="salir">Salir</button>` : ''}</header><div id="estado" class="estado" hidden></div><main id="main"></main>`;
  estado();
  ({ menu: vMenu, pedido: vPedido, pedidos: vPedidos, clientes: vClientes, importarc: vImportarC, cliente: vCliente, elegir: vElegir, productos: vProductos, producto: vProducto, usuarios: vUsuarios, usuario: vUsuario, importar: vImportar, clave: vClave, promos: vPromos, precios: vPrecios })[view]();
}
function login() {
  $('#app').innerHTML = `<form class="login"><h1>Distribuidora</h1>
    <label>Usuario</label><input id="u" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <label>Contraseña</label><input id="pw" type="password" autocomplete="current-password" required>
    <p id="err" class="mut" style="color:var(--bad)"></p><button class="btn">Ingresar</button>
    <button type="button" id="inst" class="btn sec" style="margin-top:12px" ${instalar ? '' : 'hidden'}>📲 Instalar app en el celular</button>
    <p class="mut" style="text-align:center;margin-top:14px">iPhone: Safari → Compartir → "Agregar a inicio".<br>Android: menú de Chrome → "Instalar app".</p></form>`;
  $('#inst').onclick = async () => { if (instalar) { instalar.prompt(); instalar = null; $('#inst').hidden = true; } };
  $('form').onsubmit = async e => {
    e.preventDefault();
    try {
      const j = await api('POST', 'p/login', { user: $('#u').value.trim(), pass: $('#pw').value });
      token = j.token; user = j.user; localStorage.setItem('pd_token', token); localStorage.setItem('pd_user', JSON.stringify(user));
      await cargar(); go('menu');
    } catch (er) { $('#err').textContent = er.message; }
  };
}
function vMenu() {
  const a = esAdmin();
  $('#main').innerHTML = `${a && !dbOk ? '<div class="hint" style="background:#fee2e2;color:#7f1d1d;padding:10px;border-radius:8px;margin-bottom:10px"><b>Base de datos no conectada.</b> Los usuarios y pedidos se borran en cada deploy. Revisá la variable DATABASE_URL en Railway.</div>' : ''}<p class="mut">${esc(user.nombre)} · ${a ? 'Administrador' : 'Vendedor'}</p><div class="menu">
    <button class="main" data-go="pedido" data-nuevo="1"><span>🛒</span>Cargar pedido</button>
    <button data-go="pedidos"><span>📋</span>${a ? 'Todos los pedidos' : 'Mis pedidos'} (${pedidos.length})</button>
    <button data-go="clientes"><span>👤</span>Clientes (${clientes.length})</button>
    <button data-go="precios"><span>💲</span>Precios y PDF</button>
    <button data-go="promos"><span>🏷️</span>Promos de la semana</button>
    ${a ? `<button data-go="productos"><span>📦</span>Productos (${productos.length})</button>
    <button data-go="importar"><span>📥</span>Importar / exportar Excel</button>
    <button data-go="usuarios"><span>👥</span>Usuarios</button>` : ''}
    <button data-go="clave"><span>🔑</span>Mi contraseña</button></div>`;
}

/* búsqueda común: el input no se vuelve a dibujar al filtrar */
function buscador(extra = '') {
  return `<input id="q" type="search" placeholder="Buscar por nombre o código" value="${esc(q)}" autocomplete="off">${extra}<div id="lista"></div>`;
}
function filtrar(arr) { const n = norm(q); return n ? arr.filter(p => norm(p.nombre).includes(n) || norm(p.codigo).includes(n)) : arr; }
function enlazarBuscador(pintar) { $('#q').oninput = e => { q = e.target.value; pintar(); }; pintar(); }
const vacio = t => `<p class="mut" style="text-align:center;padding:24px 0">${t}</p>`;
const sinPrecio = p => !(p.precio > 0);
const precioHtml = p => sinPrecio(p) && !(p.promo && p.precioPromo > 0) ? '<span class="tag">Sin precio</span>' : p.promo && p.precioPromo > 0 ? `<span class="price"><s>${money(p.precio)}</s>${money(p.precioPromo)}</span>` : `<span class="price">${money(p.precio)}</span>`;

/* ---------- cargar / editar pedido ---------- */
/* día y turno: quedan fijados para los pedidos de la sesión hasta que se cambien */
const hoy = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const ss = (k, v) => { try { if (v !== undefined) sessionStorage.setItem(k, v); return sessionStorage.getItem(k); } catch { return null; } };
const diaSesion = () => ss('pd_dia') || hoy();
const TURNOS = { manana: 'Mañana', tarde: 'Tarde' };
const diaTxt = d => d ? new Date(d + 'T00:00').toLocaleDateString('es-AR', { weekday: 'short', day: '2-digit', month: '2-digit' }) : '';
function nuevoDraft(ped) {
  draft = ped ? { id: ped.id, dia: ped.dia || diaSesion(), turno: ped.turno || '', clienteId: ped.clienteId || null, legacy: !ped.clienteId, cliente: ped.cliente, nota: ped.nota || '', items: Object.fromEntries(ped.items.map(i => [i.pid, i.cant])), orig: Object.fromEntries(ped.items.map(i => [i.pid, i])) }
              : { id: null, dia: diaSesion(), turno: ss('pd_turno') || '', clienteId: null, uid: (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2)), cliente: '', nota: '', items: {}, orig: {} };
}
const precioLinea = p => draft.orig[p.id] ? draft.orig[p.id].precio : efectivo(p);
function totalDraft() { return productos.reduce((s, p) => s + (draft.items[p.id] || 0) * precioLinea(p), 0); }
function vPedido() {
  $('#main').innerHTML = `<label>Cliente</label><button class="btn sec" data-act="cambiarCliente" style="text-align:left;display:flex;justify-content:space-between"><span>${draft.cliente ? '👤 ' + esc(draft.cliente) : 'Elegir cliente…'}</span><span class="mut">${draft.cliente ? 'Cambiar' : '›'}</span></button>
    <div class="row" style="border:0;align-items:flex-end"><div style="flex:1.2"><label>Día de entrega</label><input id="dia" type="date" value="${esc(draft.dia)}"></div>
      <div style="flex:1"><label>Turno</label><div class="chips" style="margin:0" id="turnos">${Object.entries(TURNOS).map(([k, v]) => `<button type="button" data-turno="${k}" class="${draft.turno === k ? 'on' : ''}" style="flex:1;min-height:46px">${v}</button>`).join('')}</div></div></div>
    <div id="detalle" class="card detalle"></div>
    <div id="notaBox" style="margin-top:10px"></div>
    <div style="height:10px"></div>${buscador()}
    <div class="bar"><div class="tot" id="tot"></div><button class="btn" data-act="guardarPedido">${draft.id ? 'Guardar cambios' : 'Guardar pedido'}</button></div>`;
  editNota = false; pintarNota();
  $('#dia').onchange = e => { draft.dia = e.target.value; if (!draft.id && draft.dia) ss('pd_dia', draft.dia); };
  enlazarBuscador(pintarPedido);
}
const enPed = p => draft.items[p.id] > 0;
function pintarPedido() { pintarLista(); pintarDetalle(); pintarTotal(); }
function pintarLista() {
  if (!q.trim()) { $('#lista').innerHTML = ''; return; }   // sin búsqueda no se muestra nada
  const base = productos.filter(p => p.activo || sinPrecio(p) || enPed(p));
  const todos = filtrar(base), lista = todos.slice(0, 30);   // orden fijo: lo elegido no sube, queda en el detalle
  $('#lista').innerHTML = lista.length ? `<div class="card">${lista.map(p => {
    const c = draft.items[p.id] || 0, bloq = !p.activo && !c;   // sin precio / desactivado: se ve pero no se puede pedir
    return `<div class="row ${bloq ? 'off' : ''}" ${bloq ? '' : `data-sel="${p.id}"`} style="${c ? 'background:color-mix(in srgb,var(--pri) 10%,transparent)' : ''}"><div class="nm"><b>${esc(p.nombre)}</b><span class="mut">${esc(p.codigo)} · </span>${p.promo && p.precioPromo > 0 ? '<span class="tag promo">PROMO</span> ' : ''}${precioHtml({ ...p, precio: p.precio, precioPromo: draft.orig[p.id] ? 0 : p.precioPromo, promo: !draft.orig[p.id] && p.promo })}</div>
      ${bloq ? '<span class="tag">No disponible</span>' : c ? `<span class="tag ok">✓ ${c}</span>` : '<span class="mut">+</span>'}</div>`;
  }).join('')}</div>${todos.length > lista.length ? `<p class="mut" style="text-align:center">Mostrando ${lista.length} de ${todos.length}: seguí escribiendo para afinar</p>` : ''}` : vacio('Sin resultados');
}
function pintarDetalle() {
  const sel = productos.filter(enPed);
  $('#detalle').innerHTML = sel.length ? `<b>Detalle del pedido</b>` + sel.map(p => `<div class="row" data-pid="${p.id}"><div class="nm"><b>${esc(p.nombre)}</b><span class="mut">${money(precioLinea(p))} c/u · subtotal <b data-sub>${money(draft.items[p.id] * precioLinea(p))}</b></span></div>
      <div class="qty"><button data-q="-1">−</button><input class="qin" type="number" inputmode="numeric" min="0" data-qin="${p.id}" value="${draft.items[p.id]}"><button data-q="1">+</button></div><button class="btn sec" data-quitar="${p.id}" aria-label="Quitar del pedido" style="width:38px;min-height:38px;padding:0;color:var(--bad);flex:none">✕</button></div>`).join('') + `<div class="row dtot" style="border:0"><div class="nm"><b>Total</b><span class="mut" data-dcant>${cantTxt()}</span></div><span class="price" data-dtot style="font-size:18px">${money(totalDraft())}</span></div>` : '<span class="mut">Tocá un producto de la lista para agregarlo con cantidad 1. Después ajustás la cantidad acá.</span>';
}
let editNota = false;
function pintarNota() {
  const box = $('#notaBox'); if (!box) return;
  if (editNota) {
    box.innerHTML = `<textarea id="nota" placeholder="Ej: entregar el jueves" style="min-height:90px">${esc(draft.nota)}</textarea><button class="btn sec" data-act="cerrarNota" style="margin-top:8px">Listo</button>`;
    $('#nota').oninput = e => draft.nota = e.target.value; $('#nota').focus();
  } else if (draft.nota) box.innerHTML = `<div class="card"><span class="mut">Nota</span><br>${esc(draft.nota)}</div><button class="btn sec" data-act="editarNota">Editar nota</button>`;
  else box.innerHTML = '<button class="btn sec" data-act="editarNota">📝 Agregar nota</button>';
}
const cantTxt = () => { const k = Object.keys(draft.items).length, n = Object.values(draft.items).reduce((a, b) => a + b, 0); return `${k} ${k === 1 ? 'producto' : 'productos'} · ${n} u.`; };
function pintarTotal() {
  $('#tot').innerHTML = `${money(totalDraft())}<br><small style="font-weight:600;font-size:13px">${cantTxt()}</small>`;
  const dc = $('[data-dcant]'); if (dc) dc.textContent = cantTxt();
  const dt = $('[data-dtot]'); if (dt) dt.textContent = money(totalDraft());
}
function cambiarCant(pid, d, fijo) {
  const p = productos.find(x => x.id === pid); if (!p || Number.isNaN(fijo) || (!p.activo && !draft.items[pid])) return;
  let c = fijo !== undefined ? fijo : (draft.items[pid] || 0) + d;
  c = Math.max(0, Math.min(c, 99999));

}
async function guardarPedido() {
  const items = Object.entries(draft.items).map(([pid, cant]) => ({ pid: Number(pid), cant }));
  const body = { clienteId: draft.clienteId, cliente: draft.cliente, nota: draft.nota, dia: draft.dia, turno: draft.turno, items };
  if (!draft.clienteId && !draft.legacy) return toast('Elegí un cliente');
  if (!draft.dia) return toast('Elegí el día');
  if (!draft.turno) return toast('Elegí el turno: mañana o tarde');
  if (!items.length) return toast('El pedido no tiene productos');
  try {
    if (draft.id) await api('PUT', 'p/pedidos/' + draft.id, body); else await api('POST', 'p/pedidos', { ...body, uid: draft.uid });
    await cargar(); toast('Pedido guardado'); go('pedidos');
  } catch (e) {
    if (!e.offline) return toast(e.message);
    if (draft.id) return toast('Sin señal: para editar un pedido ya enviado necesitás conexión');
    // sin señal: queda en el teléfono y se envía solo cuando vuelva
    const total = Math.round(items.reduce((a, i) => a + i.cant * precioLinea(productos.find(p => p.id === i.pid)), 0) * 100) / 100;
    if (!lsSet('pd_cola', [...leerCola(), { uid: draft.uid, u: user.id, body, total, t: new Date().toISOString() }])) return toast('No hay espacio para guardar el pedido');
    toast('Sin señal: pedido guardado, se enviará solo'); go('pedidos');
  }
}

      if (u.id === user.id) { user = { ...user, nombre: d.nombre, usuario: d.usuario.toLowerCase(), rol: d.rol }; localStorage.setItem('pd_user', JSON.stringify(user)); }
      await cargar(); toast('Guardado'); go('usuarios');
    } catch (er) { toast(er.message); }
  };
}

/* ---------- Excel (admin) ---------- */
let importFilas = null;
const COLS = { codigo: ['codigo', 'cod', 'sku', 'code'], nombre: ['nombre', 'descripcion', 'producto', 'articulo', 'detalle'], precio: ['precio', 'price', 'importe', 'pvp'], activo: ['activo', 'habilitado'] };
function leerHoja(rows) {
  rows = rows.filter(r => r.some(c => String(c ?? '').trim() !== ''));
  const mapa = {};
  const cab = rows[0].map(norm).map(x => x.trim());
  for (const [k, ks] of Object.entries(COLS)) { const i = cab.findIndex(c => ks.some(w => c === w || c.startsWith(w))); if (i >= 0) mapa[k] = i; }
  let datos = rows;
  if (mapa.codigo !== undefined) datos = rows.slice(1);
  else Object.assign(mapa, { codigo: 0, nombre: 1, precio: 2 });   // sin encabezados: A=código, B=nombre, C=precio
  return datos.map(r => Object.fromEntries(Object.entries(mapa).map(([k, i]) => [k, r[i] ?? ''])));
}
/* PDF de lista de precios: cada línea "código  artículo  IVA  precio". Precio 0 = sin precio: queda desactivado. */
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
async function cargarPdfjs() {
  if (window.pdfjsLib) return window.pdfjsLib;
  await new Promise((ok, ko) => { const el = document.createElement('script'); el.src = PDFJS + 'pdf.min.js'; el.onload = ok; el.onerror = ko; document.head.appendChild(el); });
  const w = await (await fetch(PDFJS + 'pdf.worker.min.js')).text();
  pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([w], { type: 'text/javascript' }));
  return pdfjsLib;
}
async function filasDePdf(file) {
  const lib = await cargarPdfjs();
  const pdf = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
  const rx = /^(\S+)\s+(.+?)\s+(\d{1,2}(?:[.,]\d+)?)\s+(\d+(?:[.,]\d+)?)$/, filas = [];
  for (let n = 1; n <= pdf.numPages; n++) {
    const items = (await (await pdf.getPage(n)).getTextContent()).items.filter(i => i.str.trim());
    const lineas = [];
    for (const i of items.sort((a, b) => b.transform[5] - a.transform[5])) {
      const l = lineas.find(x => Math.abs(x.y - i.transform[5]) < 2);
      l ? l.it.push(i) : lineas.push({ y: i.transform[5], it: [i] });
    }
    for (const l of lineas) {
      const m = rx.exec(l.it.sort((a, b) => a.transform[4] - b.transform[4]).map(i => i.str.trim()).join(' ').replace(/\s+/g, ' '));
      if (m) { const precio = parseFloat(m[4].replace(',', '.')); filas.push({ codigo: m[1], nombre: m[2], precio, activo: precio > 0 ? 'si' : 'no' }); }
    }
  }
  return filas;
}
function vImportar() {
  $('#main').innerHTML = `<div class="card"><h3 style="margin:0 0 6px">Importar lista</h3>
    <p class="mut">Subí el <b>PDF de la lista de precios</b> del proveedor (código, artículo, IVA, precio; los de precio 0 quedan desactivados), o un archivo Excel (.xlsx) / CSV con columnas: <b>Código</b>, <b>Nombre</b>, <b>Precio</b> y, si querés, <b>Activo</b> (si/no). Si el archivo trae una columna Stock, se ignora. Los productos se identifican por código: los existentes se actualizan y los nuevos se crean.</p>
    <input id="arch" type="file" accept=".pdf,.xlsx,.xls,.csv"><div id="prev"></div></div>
    <div class="card"><h3 style="margin:0 0 6px">Exportar</h3><p class="mut">Descarga el listado actual en Excel; podés editarlo y volver a importarlo.</p><button class="btn sec" data-act="exportarExcel">Descargar Excel</button></div>`;
  $('#arch').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      if (/\.pdf$/i.test(f.name)) importFilas = await filasDePdf(f);
      else {
      if (!window.XLSX) return toast('No cargó el lector de Excel (revisá la conexión)');
      const wb = /\.csv$/i.test(f.name) ? XLSX.read(await f.text(), { type: 'string', raw: true }) : XLSX.read(await f.arrayBuffer(), { type: 'array' });
      importFilas = leerHoja(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true }));
      }
      if (!importFilas.length) return toast('No se encontraron productos en el archivo');
      $('#prev').innerHTML = `<p><b>${importFilas.length}</b> filas leídas${importFilas.some(r => r.activo === 'no') ? ` (${importFilas.filter(r => r.activo === 'no').length} sin precio, quedan desactivadas)` : ''}. Ejemplo: ${esc(Object.values(importFilas[0] || {}).join(' | '))}</p>
        <div class="row" style="border:0"><div class="nm"><b>La lista es el catálogo completo</b><span class="mut">Activa los que están y desactiva los que no figuran</span></div><label class="sw" style="margin:0"><input type="checkbox" id="cat"><i></i></label></div>
        <button class="btn" data-act="importarConfirmar">Importar</button>`;
    } catch { toast('No se pudo leer el archivo'); }
  };
}
async function importarConfirmar() {
  try {
    const r = await api('POST', 'p/importar', { rows: importFilas, catalogoCompleto: $('#cat').checked });
    await cargar();
    $('#prev').innerHTML = `<p><b>Listo:</b> ${r.creados} creados, ${r.actualizados} actualizados, ${r.desactivados} desactivados.</p>${r.errores.length ? `<p class="mut" style="color:var(--bad)">${r.errores.length} filas con error:<br>${r.errores.slice(0, 30).map(esc).join('<br>')}</p>` : ''}`;
  } catch (e) { toast(e.message); }
}
function exportarExcel() {
  if (!window.XLSX) return toast('No cargó el generador de Excel (revisá la conexión)');
  const ws = XLSX.utils.json_to_sheet(productos.map(p => ({ 'Código': p.codigo, 'Nombre': p.nombre, 'Precio': p.precio, 'Activo': p.activo ? 'si' : 'no' })));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Productos');
  XLSX.writeFile(wb, 'productos-' + new Date().toISOString().slice(0, 10) + '.xlsx');
}

/* ---------- eventos ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('button, [data-sel], [data-ped], [data-edit], [data-edituser], [data-editcli], [data-cli], [data-precio], [data-promoprecio], [data-nuevapromo]');
  if (!t || e.target.closest('[data-stop]')) return;
  const d = t.dataset, row = t.closest('[data-pid]');
  if (d.quitar) { delete draft.items[d.quitar]; const y = window.scrollY; pintarPedido(); window.scrollTo(0, y); }
  else if (d.sel) { q = ''; $('#q').value = ''; cambiarCant(+d.sel, 1); }   // tocar el producto lo agrega con cantidad 1; después se ajusta en el detalle
  else if (d.go) { if (d.nuevo) nuevoDraft(); go(d.go); }
  else if (d.act === 'atras') {
    if (eligiendoPromo) { eligiendoPromo = false; return render(); }
    go({ producto: 'productos', usuario: 'usuarios', cliente: clienteVolver === 'elegir' ? 'elegir' : 'clientes', importarc: 'clientes', clientes: 'menu', elegir: 'pedido', pedido: draft && draft.id ? 'pedidos' : 'menu' }[view] || 'menu');
  }
  else if (d.act === 'salir') salir();
  else if (d.act === 'guardarPedido') guardarPedido();
  else if (d.act === 'nuevoProd') { editando = { activo: true }; go('producto'); }
  else if (d.act === 'borrarProd') {
    if (!confirm('¿Eliminar el producto?')) return;
    try { await api('DELETE', 'p/productos/' + editando.id); await cargar(); go('productos'); } catch (er) { toast(er.message); }
  }
  else if (d.act === 'agregarPromo') { eligiendoPromo = true; vElegirPromo(); }
  else if (d.act === 'pdf') exportarPdf();
  else if (d.act === 'nuevoCliente') { clienteVolver = view === 'elegir' ? 'elegir' : 'clientes'; editC = {}; go('cliente'); }
  else if (d.turno) { draft.turno = d.turno; if (!draft.id) ss('pd_turno', d.turno); $('#turnos').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.turno === d.turno)); }
  else if (d.act === 'editarNota') { editNota = true; pintarNota(); }
  else if (d.act === 'cerrarNota') { editNota = false; pintarNota(); }
  else if (d.act === 'cambiarCliente') go('elegir');
  else if (d.act === 'importarClientes') importarClientes();
  else if (d.act === 'plantillaClientes') plantillaClientes();
  else if (d.act === 'borrarCliente') {
    if (!confirm('¿Eliminar el cliente? Sus pedidos se conservan.')) return;
    try { await api('DELETE', 'p/clientes/' + editC.id); await cargar(); go('clientes'); } catch (er) { toast(er.message); }
  }
  else if (d.editcli) { clienteVolver = 'clientes'; editC = { ...clientes.find(c => c.id == d.editcli) }; go('cliente'); }
  else if (d.cli) { const c = clientes.find(x => x.id == d.cli); draft.clienteId = c.id; draft.cliente = nombreC(c); go('pedido'); }
  else if (d.act === 'nuevoUsuario') { editU = { rol: 'vendedor', activo: true }; go('usuario'); }
  else if (d.act === 'borrarUsuario') {
    if (!confirm('¿Eliminar el usuario? Sus pedidos se conservan.')) return;
    try { await api('DELETE', 'p/usuarios/' + editU.id); await cargar(); go('usuarios'); } catch (er) { toast(er.message); }
  }
  else if (d.edituser) { editU = { ...usuarios.find(u => u.id == d.edituser) }; go('usuario'); }
  else if (d.reint) { lsSet('pd_cola', leerCola().map(x => x.uid === d.reint ? { uid: x.uid, u: x.u, body: x.body, total: x.total, t: x.t } : x)); render(); sincronizar(); }
  else if (d.delcola) {
    if (!confirm('¿Eliminar este pedido pendiente? No se va a enviar.')) return;
    const it = leerCola().find(x => x.uid === d.delcola);
    lsSet('pd_cola', leerCola().filter(x => x.uid !== d.delcola)); cacheDatos(); render();
  }
  else if (d.act === 'importarConfirmar') importarConfirmar();
  else if (d.act === 'exportarExcel') exportarExcel();
  else if (d.act === 'borrarPedido') borrarPedido();
  else if (d.ped) { nuevoDraft(pedidos.find(p => p.id == d.ped)); go('pedido'); $('#main').insertAdjacentHTML('beforeend', `<div style="margin-top:80px"><button class="btn bad" data-act="borrarPedido">Eliminar pedido</button></div>`); }
  else if (d.edit) { editando = { ...productos.find(p => p.id == d.edit) }; go('producto'); }
  else if (d.f) { filtro = d.f; render(); }
  else if (d.q && row) cambiarCant(+row.dataset.pid, +d.q, d.q === 'set' ? +(prompt('Cantidad', draft.items[row.dataset.pid] || 0) ?? NaN) : undefined);
  else if (d.quitarpromo) { await setProd(+d.quitarpromo, { promo: false }); render(); }
  else if (d.promoprecio) { const p = productos.find(x => x.id == d.promoprecio), v = prompt('Precio promo', p.precioPromo || ''); if (v !== null) { await setProd(p.id, { precioPromo: v }); render(); } }
  else if (d.nuevapromo) { const p = productos.find(x => x.id == d.nuevapromo), v = prompt('Precio promo para ' + p.nombre); if (v) { await setProd(p.id, { promo: true, precioPromo: v }); eligiendoPromo = false; render(); } }
  else if (d.precio) { const p = productos.find(x => x.id == d.precio), v = prompt('Precio de ' + p.nombre, p.precio); if (v !== null && v !== '') { await setProd(p.id, { precio: v }); render(); } }
});
// cantidad escrita con el teclado en el detalle
document.addEventListener('input', e => {
  const pid = e.target.dataset && e.target.dataset.qin; if (!pid) return;
  const c = parseInt(e.target.value);
  if (c > 0) draft.items[pid] = Math.min(c, 99999); else if (e.target.value !== '') delete draft.items[pid];
  const p = productos.find(x => x.id == pid), sub = e.target.closest('.row').querySelector('[data-sub]');
  if (sub && c > 0) sub.textContent = money(c * precioLinea(p));
  pintarLista(); pintarTotal();
});
document.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.qin) { const y = window.scrollY; pintarPedido(); window.scrollTo(0, y); }
});
document.addEventListener('focusin', e => { if (e.target.dataset && e.target.dataset.qin) e.target.select(); });
document.addEventListener('change', async e => {
  const id = e.target.dataset.activo;
  if (id) { await setProd(+id, { activo: e.target.checked }); render(); }

(async () => { if (token) { try { await cargar(); } catch (e) { if (e.offline) usarCache(); else token = null; } } try { render(); sincronizar(); } catch (e) { $('#app').innerHTML = '<p style="padding:24px;color:#b91c1c">Error: ' + esc(e.message) + '</p>'; } })();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
